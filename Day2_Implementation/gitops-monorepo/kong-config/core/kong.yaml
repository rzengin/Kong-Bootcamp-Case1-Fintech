_format_version: '3.0'
plugins:
- name: opentelemetry
  config:
    resource_attributes:
      service.name: RZE_kong_dp
      alumno_id: RZE
      deployment.environment: workshop
    traces_endpoint: http://194.140.199.236:4318/v1/traces
    logs_endpoint: http://194.140.199.236:4318/v1/logs
    header_type: w3c
services:
- name: accounts-service
  url: http://httpbin.default.svc.cluster.local:8080/anything
  routes:
  - name: accounts-route
    paths:
    - /accounts
    plugins:
    - name: proxy-cache-advanced
      config:
        strategy: memory
        memory:
          dictionary_name: kong_db_cache
        cache_ttl: 300
    - name: openid-connect
      config:
        issuer: http://keycloak.default.svc.cluster.local:8080/realms/master
        client_id:
        - kong
        client_secret:
        - secret
        session_secret: my_secret_session_key
        cache_tokens_salt: my_secret_salt
        auth_methods:
        - password
        - client_credentials
        - bearer
